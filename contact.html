<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Contact</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Port<span>folio</span>.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
    <main class="page-container">
        <div class="contact-wrapper">
            <div class="contact-info">
                <h1 class="page-title">Let's <span>Talk</span></h1>
                <p>Interested in working together or just want to say hi? I'd love to hear from you. Fill out the form or reach out via social media.</p>
                
                <div class="contact-details">
                    <div class="contact-item">
                        <div class="icon">📧</div>
                        <div>
                            <h4>Email</h4>
                            <p>hello@example.com</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <div class="icon">📍</div>
                        <div>
                            <h4>Location</h4>
                            <p>San Francisco, CA</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="contact-form-container">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="How can I help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn primary submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
